<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZDTecnoc - Iniciar Sesión</title>
  <!-- Conexión al CSS -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main class="login-container">
    <section class="login-card">
      <header class="login-header">
        <span class="brand-name text-xl">ZDTecnoc</span>
        <h1 class="text-lg">Iniciar Sesión</h1>
        <p class="text-sm">Panel de Gestión de Tienda Tecnológica</p>
      </header>

      <form action="#" method="post">
        <div class="form-group">
          <label for="email" class="text-sm">Correo Electrónico:</label>
          <input type="text" id="email" name="email" class="form-input text-base" required>
        </div>
        
        <div class="form-group">
          <label for="password" class="text-sm">Contraseña:</label>
          <input type="password" id="password" name="password" class="form-input text-base" required>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary text-base">Ingresar</button>
      </form>
    </section>
  </main>

  <footer style="text-align: center; padding: 1rem;" class="text-xs">
    <p>&copy; 2026 ZDTecnoc. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
